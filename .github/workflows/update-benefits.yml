name: Update benefit JSON

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-benefits.yml"
      - "scripts/**"
      - "tests/collector-rules.test.mjs"
      - "data/benefits.snapshot.json"
      - "public/data/benefits.json"
      - "package.json"
      - "package-lock.json"
  schedule:
    # 09:00, 11:00, 15:00, 19:00 KST
    - cron: "0 0,2,6,10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-benefits
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 수집 규칙이 깨졌으면 수집·업로드 전에 멈춘다.
      - run: npm run test:rules

      # 투썸·LG U+·KT·더벤티는 해외 요청을 막아서 서울 리전 중계(relay/)를 거친다. 값이 없으면 직접 요청한다.
      - run: npm run collect
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
      - run: npm run build

      # 생성된 JSON이 API 계약을 지키는지 확인한 뒤에만 업로드한다.
      - name: Validate generated JSON
        run: node --test tests/rendered-html.test.mjs tests/worker-api.test.mjs

      - name: Upload public JSON to Cloudflare R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: npm run upload:r2

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- data/benefits.snapshot.json public/data/benefits.json; then
            echo "No benefit changes"
            exit 0
          fi

          git config user.name "benefit-radar-bot"
          git config user.email "benefit-radar-bot@users.noreply.github.com"

          # 수집하는 동안 main이 바뀌었으면(PR 머지, 다른 수집 실행) rebase가 JSON에서 충돌한다.
          # 두 파일은 매번 새로 만드는 결과물이므로, 최신 main 위에 이번 결과를 그대로 덮어 커밋한다.
          tmp="$RUNNER_TEMP/benefits"
          mkdir -p "$tmp"
          cp data/benefits.snapshot.json "$tmp/snapshot.json"
          cp public/data/benefits.json "$tmp/public.json"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$tmp/snapshot.json" data/benefits.snapshot.json
            cp "$tmp/public.json" public/data/benefits.json
            if git diff --quiet -- data/benefits.snapshot.json public/data/benefits.json; then
              echo "No benefit changes against latest main"
              exit 0
            fi
            git add data/benefits.snapshot.json public/data/benefits.json
            git commit --quiet -m "Update benefit snapshot"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying on latest main"
            sleep $((attempt * 5))
          done
          echo "Could not push benefit snapshot after 3 attempts" >&2
          exit 1

      # 출처 수집 실패를 "수집 상태" 이슈 하나로 관리한다. 본문만 고쳐서 알림이 반복되지 않게 하고, 정상화되면 닫는다.
      - name: Report collector health
        if: ${{ always() && hashFiles('public/data/benefits.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="수집 상태: 출처 수집 실패"
          node scripts/check-collector-health.mjs > health.md
          unhealthy=$(node scripts/check-collector-health.mjs --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).unhealthy))')
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')

          if [ "$unhealthy" = "true" ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file health.md
            else
              gh issue create --title "$title" --body-file health.md
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "모든 출처가 정상 수집되어 닫습니다."
          fi
