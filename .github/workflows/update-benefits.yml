name: Update benefit JSON

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-benefits.yml"
      - "scripts/collect-benefits.mjs"
      - "data/benefits.snapshot.json"
      - "public/data/benefits.json"
      - "package.json"
      - "package-lock.json"
  schedule:
    # 09:00, 11:00, 15:00, 19:00 KST
    - cron: "0 0,2,6,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run collect
      - run: npm run build

      - name: Upload public JSON to Cloudflare R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: npm run upload:r2

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- data/benefits.snapshot.json public/data/benefits.json; then
            echo "No benefit changes"
            exit 0
          fi

          git config user.name "benefit-radar-bot"
          git config user.email "benefit-radar-bot@users.noreply.github.com"
          git add data/benefits.snapshot.json public/data/benefits.json
          git commit -m "Update benefit snapshot"
          git push
